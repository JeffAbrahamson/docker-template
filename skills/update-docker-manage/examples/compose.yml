# Change this name when copying the template to another repository.
# Otherwise repositories with docker/ directories would share a project.
name: docker-template

services:
  dev-base:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compile-for-dev
    image: docker-template-dev
    working_dir: /devsrc
    volumes:
      - ..:/devsrc

  dev-compile:
    extends: dev-base
    command: ["/bin/bash", "-c", 'exec make -j "$$(nproc)" -k']

  dev-test:
    extends: dev-base
    command: ["make", "test"]

  dev-sh:
    extends: dev-base
    command: sleep infinity
